name: Build solution

env:
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

 
      - name: Setup .NET SDK .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'


      - name: Restore dependencies
        run: dotnet restore BookingHub.slnx

      - name: Install SonarScanner
        if: ${{ env.SONAR_TOKEN != '' }}
        shell: bash
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

  
      - name: SonarCloud analysis skipped
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "Skipping SonarCloud analysis because SONAR_TOKEN is not configured."


      - name: Begin SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet sonarscanner begin \
            /o:"tesisenel" \
            /k:"TesisEnel_UASD_BookingHubBarberia_P4_2026_03" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.host.url="https://sonarcloud.io"

      - name: Build solution
        run: dotnet build BookingHub.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test BookingHub.slnx --configuration Release --no-build --verbosity minimal --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: End SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: .NET test results
          path: 'TestResults/**/*.trx'
          reporter: dotnet-trx
