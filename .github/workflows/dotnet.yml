name: Build solution

env:
  SONAR_PROJECT_KEY: TesisEnel_UASD_BookingHubBarberia_P4_2026_03

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore solution
        run: dotnet restore BookingHub.slnx
      - name: Install SonarScanner
        shell: bash
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Begin SonarCloud analysis
        run: |
          dotnet sonarscanner begin \
            /o:"${{ vars.SONAR_ORGANIZATION }}" \
            /k:"TesisEnel_UASD_BookingHubBarberia_P4_2026_03" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io"
      - name: Build solution
        run: dotnet build BookingHub.slnx --configuration Release --no-restore
      - name: Run tests
        run: dotnet test BookingHub.slnx --configuration Release --no-build --verbosity minimal --logger "trx;LogFileName=test-results.trx" --results-directory TestResults
      - name: End SonarCloud analysis
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: .NET test results
          path: 'TestResults/**/*.trx'
          reporter: dotnet-trx
